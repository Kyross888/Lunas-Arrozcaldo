    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --primary: #5a67d8;
            --primary-hover: #434190;
            --bg: #f4f6f9;
            --white: #ffffff;
            --text-dark: #2d3748;
            --text-light: #718096;
            --danger: #e53e3e;
            --success: #38a169;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-dark);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            background: var(--white);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid var(--border);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .brand {
            margin-bottom: 30px;
            cursor: pointer;
            text-align: center;
        }

        .brand img {
            max-width: 100%;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar.collapsed .brand img {
            width: 40px;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li {
            margin-bottom: 10px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: var(--primary);
            color: white;
        }

        .nav-links i {
            min-width: 30px;
            font-size: 18px;
        }

        .sidebar.collapsed .nav-links span {
            display: none;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            height: 70px;
            gap: 20px;
        }

        .content {
            padding: 30px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* --- CARDS --- */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card h3 {
            color: var(--text-light);
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-dark);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* --- CHARTS --- */
        .analytics-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* --- RESPONSIVE BREAKPOINTS --- */

        /* Tablets: stack charts vertically */
        @media (max-width: 992px) {
            .analytics-container {
                grid-template-columns: 1fr;
            }
        }

        /* Mobile: top nav bar instead of sidebar */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            .sidebar {
                width: 100% !important;
                height: auto;
                flex-direction: row;
                padding: 10px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                overflow-x: auto;
            }

            .brand {
                display: none;
            }

            .nav-links {
                display: flex;
                width: 100%;
                gap: 5px;
            }

            .nav-links li {
                margin-bottom: 0;
                flex-shrink: 0;
            }

            .nav-links a span {
                display: none;
            }

            .nav-links i {
                min-width: unset;
            }

            .main-content {
                overflow: visible;
            }

            .content {
                overflow-y: visible;
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                height: auto;
                padding: 15px;
            }

            .grid-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 16px;
            }

            .card .number {
                font-size: 22px;
            }
        }

        /* Small phones: single column */
        @media (max-width: 400px) {
            .grid-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        (function() {
            var s = localStorage.getItem("pos_theme");
            if (s) {
                try {
                    var t = JSON.parse(s);
                    document.documentElement.style.setProperty("--primary", t.primary);
                    document.documentElement.style.setProperty("--primary-hover", t.hover);
                } catch (e) {}
            }
        })()
    </script>
</head>

<body>

                document.getElementById('sidebar') && document.getElementById('sidebar').classList.add('collapsed');
            }
        </script>
        <div class="brand" onclick="toggleSidebar()">
<img src="lunas.jpg" alt="Luna's Logo">        </div>
        <ul class="nav-links">
            <li><a href="dashboard.php" class="active"><i class="fa-solid fa-gauge"></i> <span>Dashboard</span></a></li>
            <li><a href="pos_terminal.php"><i class="fa-solid fa-cash-register"></i> <span>New Order</span></a></li>
            <li><a href="inventory.php"><i class="fa-solid fa-box"></i> <span>Inventory</span></a></li>
            <li><a href="salesreport.php"><i class="fa-solid fa-chart-line"></i> <span>Sales Report</span></a></li>
            <li><a href="analytics.php"><i class="fa-solid fa-chart-pie"></i> <span>Analytics</span></a></li>

    <div class="main-content">
        <header class="header">
            <h2 style="margin:0;">Dashboard</h2>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:5px;background:#f8fafc;padding:5px 10px;border-radius:6px;border:1px solid #ddd;">
                    <small style="color:var(--text-light);font-weight:bold;">History:</small>

                </div>

                    <option value="month">This Month</option>

            </div>

        <div class="content">
            <div class="grid-cards">
                <div class="card" style="border-left: 5px solid #5a67d8;">
                    <h3 id="lbl-sales">Total Sales Today</h3>
                    <div class="number" id="kpi-revenue">₱0.00</div>
                </div>
                <div class="card" style="border-left: 5px solid #48bb78;">
                    <h3>Orders Completed</h3>
                    <div class="number" id="kpi-orders">0</div>
                </div>
                <div class="card" style="border-left: 5px solid #ed8936;">
                    <h3>Low Stock Items</h3>
                    <div class="number" id="kpi-lowstock">0</div>
                </div>
                <div class="card" style="border-left: 5px solid #e53e3e;">
                    <h3>OUT OF STOCK</h3>

                </div>

            <div class="analytics-container">

                    <h3 id="lbl-trend">Revenue Trend (Last 7 Days)</h3>

                        <canvas id="revenueChart"></canvas>
                    </div>

                <div class="card">
                    <h3>Sales by Category <span style="float:right;color:var(--text-light);"><i class="fa-solid fa-ellipsis-vertical"></i></span></h3>
                    <div class="chart-wrapper">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h3 id="lbl-top">Top Selling Items Today</h3>

                </div>
            </div>
        </div>

    <script src="js/api.js"></script>
    <script>
        // Inline fallback: parse DB timestamp as PH time (UTC+8)
        // Works even if api.js path is wrong or fails to load
        if (typeof parseUTC === 'undefined') {
            function parseUTC(ts) {
                if (!ts) return new Date(NaN);
                var s = ts.replace(' ', 'T').replace(/[+Z].*$/, '');
                return new Date(s + '+08:00');
            }
        }
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sb.classList.contains('collapsed') ? '1' : '0');
        }

        // ── Charts ────────────────────────────────────────────
        let revenueChart, categoryChart, me;

        const CATEGORIES = [
            { key: 'Breakfast', label: 'Breakfast', color: '#5a67d8' },
            { key: 'Merienda', label: 'Merienda', color: '#4fd1c5' },
            { key: 'Burgers And Sandwiches', label: 'Burgers & Sand.', color: '#f6ad55' },
            { key: 'Rice Meal', label: 'Rice Meal', color: '#fc8181' },
            { key: 'Native', label: 'Native', color: '#68d391' },
            { key: 'Dessert', label: 'Dessert', color: '#f687b3' },
            { key: 'Drinks', label: 'Drinks', color: '#76e4f7' },
        ];

        const ymd = d => d.toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });
        const shift = (str, n) => { const d = new Date(str + 'T00:00:00+08:00'); d.setDate(d.getDate() + n); return ymd(d); };

        // Returns {from,to, trendFrom,trendTo, label}
        function currentRange() {
            const today = ymd(new Date());
            const picked = document.getElementById('historyDate').value;
            if (picked) return { from: picked, to: picked, trendFrom: shift(picked, -6), trendTo: picked, label: 'on ' + picked };
            const r = document.getElementById('timeFilter').value;
            if (r === '7days') return { from: shift(today, -6), to: today, trendFrom: shift(today, -6), trendTo: today, label: '(Last 7 Days)' };
            if (r === 'month') { const f = today.slice(0, 8) + '01'; return { from: f, to: today, trendFrom: f, trendTo: today, label: '(This Month)' }; }
            return { from: today, to: today, trendFrom: shift(today, -6), trendTo: today, label: 'Today' };
        }

        function changeRange() { document.getElementById('historyDate').value = ''; loadDashboard(); }
        function filterByDate() { if (document.getElementById('historyDate').value) loadDashboard(); }

        function initCharts() {
            revenueChart = new Chart(document.getElementById('revenueChart').getContext('2d'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Revenue (₱)', data: [], borderColor: '#5a67d8', backgroundColor: 'rgba(90,103,216,0.1)', borderWidth: 3, fill: true, tension: 0.4 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } },
                }
            });
            categoryChart = new Chart(document.getElementById('categoryChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: CATEGORIES.map(c => c.label), datasets: [{ data: CATEGORIES.map(() => 1), backgroundColor: CATEGORIES.map(() => '#e2e8f0'), borderWidth: 0, hoverOffset: 8 }] },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '65%',
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 8, font: { size: 11 } } } },
                }
            });
        }

        async function loadDashboard() {
            if (!me) {
                me = await requireLogin();
                if (!me) return;
                initCharts();
            }
            const b = me.branch_id || '';
            const R = currentRange();
            const range = { from: R.from, to: R.to };
            const isToday = R.label === 'Today';

            document.getElementById('lbl-sales').textContent = 'Total Sales ' + R.label;
            document.getElementById('lbl-top').textContent = 'Top Selling Items ' + R.label;
            document.getElementById('lbl-trend').textContent = R.label === '(This Month)' ? 'Revenue Trend (This Month)' : 'Revenue Trend (7 Days' + (R.from === R.to && !isToday ? ' to ' + R.to : '') + ')';

            // Self-contained fetcher (does not depend on a cached/old js/api.js)
            const dq = (action, r) => fetch('dashboard.php?action=' + action + (b ? '&branch_id=' + b : '') +
                '&date_from=' + r.from + '&date_to=' + r.to, { credentials: 'same-origin' })
                .then(x => x.json()).catch(() => ({ success: false, data: [] }));
            const [kpis, trend, cats, top] = await Promise.all([
                dq('kpis', range),
                dq('revenue_trend', { from: R.trendFrom, to: R.trendTo }),
                dq('category_sales', range),
                dq('top_products', range),
            ]);

            if (kpis.success) {
                document.getElementById('kpi-revenue').textContent = fmt(kpis.revenue_today);
                document.getElementById('kpi-orders').textContent = kpis.orders_today;
                document.getElementById('kpi-lowstock').textContent = kpis.low_stock;
                document.getElementById('kpi-outstock').textContent = kpis.out_of_stock;
            }

            const rows = trend.success ? trend.data : [];
            revenueChart.data.labels = rows.map(d => new Date(d.day + 'T00:00:00+08:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'Asia/Manila' }));
            revenueChart.data.datasets[0].data = rows.map(d => parseFloat(d.revenue));
            revenueChart.update();

            const totals = {};
            CATEGORIES.forEach(c => totals[c.key] = 0);
            (cats.success ? cats.data : []).forEach(c => { if (totals[c.category] !== undefined) totals[c.category] += c.qty; });
            const arr = CATEGORIES.map(c => totals[c.key]);
            const has = arr.some(v => v > 0);
            categoryChart.data.datasets[0].data = has ? arr : CATEGORIES.map(() => 1);
            categoryChart.data.datasets[0].backgroundColor = CATEGORIES.map(c => has ? c.color : '#e2e8f0');
            categoryChart.update();

            const el = document.getElementById('recentActivity');
            if (top.success && top.data.length) {
                el.innerHTML = top.data.map(p =>
                    `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;">
                        <span>${escHtml(p.name)}</span>
                        <span style="font-weight:600;">${p.total_qty} sold · ${fmt(p.total_revenue)}</span>
                    </div>`).join('');
            } else {
                el.innerHTML = '<p style="color:#718096;margin-top:15px;">No sales data for this period.</p>';
            }
        }

        function escHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        loadDashboard();
    </script>

    <!-- PWA Registration -->
    <script src="js/pwa.js"></script>
</body>
